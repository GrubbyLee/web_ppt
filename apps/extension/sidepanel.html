<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Showit 控制器</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <header>
        <strong>Showit</strong>
        <span id="native-status">连接中</span>
      </header>
      <section>
        <p id="page-title">等待演示会话</p>
        <p id="page-meta">等待桌面端状态。</p>
        <div id="timer"><span>总计时</span><strong id="total-time">00:00</strong><span>本页</span><strong id="page-time">00:00</strong></div>
        <div id="current-step"><span id="step-counter">步骤 --/--</span><p id="step-text">等待当前步骤</p></div>
      </section>
      <form id="origin-form">
        <label for="origin">授权业务站点</label>
        <div>
          <input id="origin" name="origin" type="url" placeholder="https://system.example.com" autocomplete="url" required />
          <button type="submit" title="授权此站点">授权</button>
        </div>
        <p id="origin-status" aria-live="polite"></p>
      </form>
      <nav>
        <button id="prev-step" type="button">上一步</button>
        <button id="next-step" type="button">下一步</button>
      </nav>
      <nav>
        <button id="prev" type="button">上一页</button>
        <button id="next" type="button">下一页</button>
      </nav>
      <button id="capture" type="button" disabled>投送当前标签</button>
      <button id="stop-capture" type="button" disabled>停止投送</button>
      <button id="open-showit" type="button">返回 Showit</button>
    </main>
    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
