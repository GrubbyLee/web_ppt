name: Build and verify Showit

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium
      - name: Run extension regressions
        shell: bash
        run: |
          xvfb-run -a npm run test:extension-browser
          xvfb-run -a npm run test:extension-e2e
          xvfb-run -a npm run test:extension-demo-e2e
          xvfb-run -a npm run test:remote-e2e

  extension:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build extension twice and verify deterministic output
        shell: bash
        run: |
          npm run release:extension
          first=$(sha256sum apps/extension/release/*.zip | awk '{print $1}')
          npm run release:extension
          second=$(sha256sum apps/extension/release/*.zip | awk '{print $1}')
          test "$first" = "$second"
      - uses: actions/upload-artifact@v4
        with:
          name: showit-extension
          path: |
            apps/extension/release/*.zip
            apps/extension/release/*.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [extension]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: showit-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/**
